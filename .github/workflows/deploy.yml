name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Safety net: if Pages "Source" is ever set back to "Deploy from a branch", GitHub also runs
      # its legacy "pages build and deployment" on every push, which publishes
      # the raw repo (index.html -> /src/main.tsx) and can finish after us.
      # Wait for it so this built deploy is always the last one to land.
      - name: Wait for legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=20" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            echo "legacy builds still running: $pending"
            [ "$pending" = "0" ] && [ "$i" -ge 3 ] && exit 0
            sleep 5
          done
          echo "timed out waiting; deploying anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
